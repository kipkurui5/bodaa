<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juja Ward Boda Boda Stage Dashboard</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          Segoe UI,
          Arial,
          sans-serif;
        display: flex;
        height: 100vh;
        color: #1f2937;
      }
      #side {
        width: 360px;
        max-width: 42vw;
        overflow-y: auto;
        padding: 14px;
        background: #f8fafc;
        border-right: 1px solid #e2e8f0;
      }
      #map {
        flex: 1;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
      }
      .cards {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .card {
        flex: 1;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
      }
      .card b {
        display: block;
        font-size: 22px;
        color: #0f766e;
      }
      label {
        display: block;
        font-size: 12px;
        margin: 8px 0 3px;
        color: #475569;
      }
      input[type="number"],
      input[type="text"] {
        width: 100%;
        padding: 7px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      button {
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: #0f766e;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      button.sec {
        background: #475569;
      }
      button.del {
        background: #b91c1c;
        padding: 3px 7px;
        font-size: 11px;
      }
      button:hover {
        opacity: 0.9;
      }
      #preview {
        max-width: 100%;
        max-height: 140px;
        margin-top: 6px;
        border-radius: 6px;
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 6px;
      }
      th,
      td {
        border-bottom: 1px solid #e2e8f0;
        padding: 4px;
        text-align: left;
      }
      tr.rec {
        cursor: pointer;
      }
      tr.rec:hover {
        background: #e6fffa;
      }
      #msg {
        font-size: 12px;
        margin-top: 6px;
        min-height: 16px;
        color: #b45309;
      }
      .hint {
        font-size: 11px;
        color: #64748b;
      }
      @media (max-width: 700px) {
        body {
          flex-direction: column-reverse;
        }
        #side {
          width: 100%;
          max-width: none;
          height: 50vh;
        }
        #map {
          height: 50vh;
          flex: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="side">
      <h1>Boda Boda Stage Collector: Juja Ward</h1>

      <div class="cards">
        <div class="card"><b id="cStages">0</b>Stages</div>
        <div class="card"><b id="cBodas">0</b>Boda bodas</div>
      </div>

      <label>X (Longitude)</label>
      <input
        type="number"
        id="lon"
        step="any"
        placeholder="click map or use GPS"
      />
      <label>Y (Latitude)</label>
      <input type="number" id="lat" step="any" />
      <div class="row" style="margin-top: 6px">
        <button class="sec" id="btnGps">📍 Use my location</button>
      </div>
      <div class="hint">Or click anywhere on the map to set the location.</div>

      <label>Number of boda bodas</label>
      <input type="number" id="count" min="0" step="1" />

      <label>Stage photo</label>
      <input type="file" id="photo" accept="image/*" hidden />
      <button class="sec" id="btnPhoto">📷 Add image of stage</button>
      <br /><img id="preview" alt="preview" />

      <div class="row" style="margin-top: 12px">
        <button id="btnSave">💾 Save stage</button>
        <button class="sec" id="btnCsv">CSV</button>
        <button class="sec" id="btnGeo">GeoJSON</button>
      </div>
      <div id="msg"></div>

      <label style="margin-top: 14px">Ward boundary (GeoJSON)</label>
      <input type="file" id="wardFile" accept=".geojson,.json" />
      <div class="hint">
        Currently using a rough placeholder until you load the official Juja
        ward file.
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>X</th>
            <th>Y</th>
            <th>Bodas</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      /* ---------- Placeholder Juja ward polygon (REPLACE with official boundary) ---------- */
      let wardGeoJSON = {
        type: "Feature",
        properties: { name: "Juja (placeholder)" },
        geometry: {
          type: "Polygon",
          coordinates: [
            [
              [36.97, -1.14],
              [37.06, -1.14],
              [37.06, -1.07],
              [36.97, -1.07],
              [36.97, -1.14],
            ],
          ],
        },
      };

      /* ---------- Map + basemaps ---------- */
      const map = L.map("map", { zoomControl: true }).setView(
        [-1.105, 37.015],
        13,
      );
      const imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles © Esri", maxZoom: 19 },
      ).addTo(map);
      const streets = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles © Esri", maxZoom: 19 },
      );
      L.control
        .layers({ "Esri Imagery": imagery, "Esri Streets": streets })
        .addTo(map);

      /* ---------- Ward mask ---------- */
      let maskLayer,
        outlineLayer,
        wardRings = [];

      function extractOuterRings(gj) {
        const rings = [];
        const geoms = [];
        (function walk(g) {
          if (g.type === "FeatureCollection") g.features.forEach(walk);
          else if (g.type === "Feature") walk(g.geometry);
          else if (g.type === "GeometryCollection") g.geometries.forEach(walk);
          else geoms.push(g);
        })(gj);
        geoms.forEach((g) => {
          if (g.type === "Polygon") rings.push(g.coordinates[0]);
          if (g.type === "MultiPolygon")
            g.coordinates.forEach((p) => rings.push(p[0]));
        });
        return rings; // arrays of [lng,lat]
      }

      function drawWard() {
        if (maskLayer) map.removeLayer(maskLayer);
        if (outlineLayer) map.removeLayer(outlineLayer);
        wardRings = extractOuterRings(wardGeoJSON);
        const world = [
          [-90, -360],
          [-90, 360],
          [90, 360],
          [90, -360],
        ];
        const holes = wardRings.map((r) => r.map((c) => [c[1], c[0]]));
        maskLayer = L.polygon([world, ...holes], {
          stroke: false,
          fillColor: "#ffffff",
          fillOpacity: 1,
          interactive: false,
        }).addTo(map);
        outlineLayer = L.geoJSON(wardGeoJSON, {
          style: { color: "#0f766e", weight: 3, fill: false },
          interactive: false,
        }).addTo(map);
        const b = outlineLayer.getBounds();
        map.fitBounds(b);
        map.setMaxBounds(b.pad(0.15));
        map.setMinZoom(map.getZoom() - 1);
      }
      drawWard();

      document.getElementById("wardFile").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            wardGeoJSON = JSON.parse(r.result);
            drawWard();
            say("Ward boundary loaded.");
          } catch (err) {
            say("Invalid GeoJSON file.");
          }
        };
        r.readAsText(f);
      });

      /* ---------- Point in ward check ---------- */
      function inRing(x, y, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0],
            yi = ring[i][1],
            xj = ring[j][0],
            yj = ring[j][1];
          if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)
            inside = !inside;
        }
        return inside;
      }
      const inWard = (lon, lat) => wardRings.some((r) => inRing(lon, lat, r));

      /* ---------- State ---------- */
      const KEY = "juja_boda_stages";
      let stages = [];
      try {
        stages = JSON.parse(localStorage.getItem(KEY) || "[]");
      } catch (e) {
        stages = [];
      }
      let photoData = null,
        tempMarker = null;
      const markers = {};
      const $ = (id) => document.getElementById(id);
      const say = (t) => {
        $("msg").textContent = t;
      };

      function persist() {
        try {
          localStorage.setItem(KEY, JSON.stringify(stages));
        } catch (e) {
          say("Storage full: export your data, then delete old records.");
        }
      }

      /* ---------- Location capture ---------- */
      function setLocation(lat, lon) {
        $("lat").value = lat.toFixed(6);
        $("lon").value = lon.toFixed(6);
        if (tempMarker) map.removeLayer(tempMarker);
        tempMarker = L.circleMarker([lat, lon], {
          radius: 9,
          color: "#f59e0b",
          weight: 3,
          fillOpacity: 0.3,
        }).addTo(map);
      }
      map.on("click", (e) => setLocation(e.latlng.lat, e.latlng.lng));
      $("btnGps").onclick = () => {
        if (!navigator.geolocation) return say("GPS not supported.");
        say("Getting location...");
        navigator.geolocation.getCurrentPosition(
          (p) => {
            setLocation(p.coords.latitude, p.coords.longitude);
            map.setView([p.coords.latitude, p.coords.longitude], 17);
            say("Location captured.");
          },
          () =>
            say("Could not get location. Allow permission or click the map."),
          { enableHighAccuracy: true, timeout: 15000 },
        );
      };

      /* ---------- Photo (compressed) ---------- */
      $("btnPhoto").onclick = () => $("photo").click();
      $("photo").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const img = new Image(),
          url = URL.createObjectURL(f);
        img.onload = () => {
          const max = 800,
            s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = img.width * s;
          c.height = img.height * s;
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          photoData = c.toDataURL("image/jpeg", 0.7);
          $("preview").src = photoData;
          $("preview").style.display = "block";
          URL.revokeObjectURL(url);
        };
        img.src = url;
      });

      /* ---------- Save ---------- */
      $("btnSave").onclick = () => {
        const lat = parseFloat($("lat").value),
          lon = parseFloat($("lon").value),
          count = parseInt($("count").value, 10);
        if (isNaN(lat) || isNaN(lon)) return say("Set the location first.");
        if (isNaN(count) || count < 0)
          return say("Enter the number of boda bodas.");
        if (
          !inWard(lon, lat) &&
          !confirm("This point is outside the Juja ward boundary. Save anyway?")
        )
          return;
        stages.push({
          id: Date.now(),
          lon,
          lat,
          count,
          photo: photoData,
          time: new Date().toISOString(),
        });
        persist();
        photoData = null;
        $("preview").style.display = "none";
        $("photo").value = "";
        $("count").value = "";
        $("lat").value = "";
        $("lon").value = "";
        if (tempMarker) {
          map.removeLayer(tempMarker);
          tempMarker = null;
        }
        say("Stage saved.");
        render();
      };

      /* ---------- Render ---------- */
      function render() {
        Object.values(markers).forEach((m) => map.removeLayer(m));
        for (const k in markers) delete markers[k];
        $("tbody").innerHTML = "";
        let total = 0;
        stages.forEach((s, i) => {
          total += s.count;
          const m = L.marker([s.lat, s.lon])
            .addTo(map)
            .bindPopup(
              `<b>Stage ${i + 1}</b><br>Boda bodas: ${s.count}<br>X: ${s.lon.toFixed(6)}<br>Y: ${s.lat.toFixed(6)}<br>${new Date(s.time).toLocaleString()}` +
                (s.photo
                  ? `<br><img src="${s.photo}" style="width:200px;margin-top:4px;border-radius:4px">`
                  : ""),
            );
          markers[s.id] = m;
          const tr = document.createElement("tr");
          tr.className = "rec";
          tr.innerHTML = `<td>${i + 1}</td><td>${s.lon.toFixed(5)}</td><td>${s.lat.toFixed(5)}</td><td>${s.count}</td><td><button class="del">✕</button></td>`;
          tr.onclick = (ev) => {
            if (ev.target.tagName === "BUTTON") return;
            map.setView([s.lat, s.lon], 17);
            m.openPopup();
          };
          tr.querySelector("button").onclick = () => {
            if (confirm("Delete this stage?")) {
              stages = stages.filter((x) => x.id !== s.id);
              persist();
              render();
            }
          };
          $("tbody").appendChild(tr);
        });
        $("cStages").textContent = stages.length;
        $("cBodas").textContent = total;
      }
      render();

      /* ---------- Export ---------- */
      function download(name, text, type) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([text], { type }));
        a.download = name;
        a.click();
      }
      $("btnCsv").onclick = () => {
        const rows = [
          "id,x_lon,y_lat,boda_count,timestamp,has_photo",
          ...stages.map((s) =>
            [s.id, s.lon, s.lat, s.count, s.time, s.photo ? "yes" : "no"].join(
              ",",
            ),
          ),
        ];
        download("boda_stages.csv", rows.join("\n"), "text/csv");
      };
      $("btnGeo").onclick = () => {
        const gj = {
          type: "FeatureCollection",
          features: stages.map((s) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [s.lon, s.lat] },
            properties: {
              id: s.id,
              boda_count: s.count,
              timestamp: s.time,
              photo: s.photo || null,
            },
          })),
        };
        download(
          "boda_stages.geojson",
          JSON.stringify(gj),
          "application/geo+json",
        );
      };
    </script>

    <!-- ================= ADDED: SHARED CLOUD STORAGE ================= -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script>
      /* 1) PASTE YOUR OWN FIREBASE CONFIG HERE (see setup steps) */
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "000000000000",
        appId: "1:000000000000:web:xxxxxxxxxxxx",
      };
      firebase.initializeApp(firebaseConfig);
      const cloud = firebase.database().ref("juja_boda_stages");

      /* 2) Keep the local save, and also push to the cloud */
      const saveLocal = persist; // original function kept untouched
      persist = function () {
        saveLocal(); // still caches in this browser
        pushToCloud(); // now also saves for everyone
      };

      function sameRecord(a, b) {
        return (
          a &&
          b &&
          a.lon === b.lon &&
          a.lat === b.lat &&
          a.count === b.count &&
          (a.time || "") === (b.time || "") &&
          (a.photo || null) === (b.photo || null)
        );
      }

      function pushToCloud() {
        cloud
          .once("value")
          .then(function (snap) {
            const remote = snap.val() || {};
            const updates = {};
            const mine = new Set();
            stages.forEach(function (s) {
              const id = String(s.id);
              mine.add(id);
              if (!sameRecord(remote[id], s)) updates[id] = s;
            });
            Object.keys(remote).forEach(function (id) {
              if (!mine.has(id)) updates[id] = null; // deleted here -> delete there
            });
            if (Object.keys(updates).length) return cloud.update(updates);
          })
          .catch(function (e) {
            say("Cloud save failed: " + e.message);
          });
      }

      /* 3) Live pull: everyone sees everyone's entries as they are added */
      let firstSync = true;
      cloud.on(
        "value",
        function (snap) {
          if (firstSync) {
            firstSync = false;
            // first ever run with an empty cloud: upload what this device had
            if (!snap.exists() && stages.length) return pushToCloud();
          }
          const remote = snap.val() || {};
          const byId = new Map(
            stages.map(function (s) {
              return [String(s.id), s];
            }),
          );
          let changed = false;

          Object.keys(remote).forEach(function (id) {
            const r = remote[id];
            const l = byId.get(id);
            if (!l) {
              stages.push(r);
              changed = true;
            } else if (!sameRecord(l, r)) {
              Object.assign(l, r);
              changed = true;
            }
          });

          const remoteIds = new Set(Object.keys(remote));
          const kept = stages.filter(function (s) {
            return remoteIds.has(String(s.id));
          });
          if (kept.length !== stages.length) {
            stages = kept;
            changed = true;
          }

          if (changed) {
            saveLocal();
            render();
          }
        },
        function (err) {
          say("Cloud sync error: " + err.message);
        },
      );
    </script>
    <!-- =============== END ADDED: SHARED CLOUD STORAGE =============== -->
  </body>
</html>
